version: '3.8'

services:
  cts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-transformation-service
    ports:
      - "8080:8080"
    environment:
      - CTS_OUTPUT_PATH=/app/output
      - CTS_PROCESSING_CONCURRENCY=4
      - CTS_PROCESSING_MAX_FILE_SIZE=10MB
      - CTS_PROCESSING_MAX_REQUEST_SIZE=50MB
      - SERVER_PORT=8080
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    volumes:
      - cts-output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'

volumes:
  cts-output:
    driver: local
